<!doctype html>
<html lang="en-MU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline — Doll Up Boutique</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #fdf8f7;
        color: #1a1212;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 340px; }
      h1 {
        margin: 0 0 12px;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 400;
      }
      p {
        margin: 0 0 24px;
        color: #4a3a3a;
        font-size: 15px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 28px;
        border-radius: 999px;
        background: #c64a36;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #1a1212; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        We can't reach Doll Up Boutique right now. Check your connection and try again.
        Your bag is saved.
      </p>
      <!-- Empty href = the page the shopper was opening (the SW serves this file
           under that URL), so "Try again" retries it rather than going home. -->
      <a href="">Try again</a>
    </main>
  </body>
</html>
